name: CI & image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: vyroclipper-extension
          path: dist/extension

  # HTTPS download for the extension: Chrome blocks the server's /extension.zip when the studio is
  # opened over plain HTTP (e.g. http://<server-ip>:8019), so every main build is also published here.
  extension-release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: extension-release
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vyroclipper-extension
          path: extension
      - name: Publish extension-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd extension && zip -qr -X ../vyroclipper-extension.zip .)
          gh release delete extension-latest --cleanup-tag --yes || true
          gh release create extension-latest vyroclipper-extension.zip \
            --target "$GITHUB_SHA" --latest \
            --title "VyroClipper extension (latest main)" \
            --notes "Chrome extension built from ${GITHUB_SHA::7}. Unzip, then chrome://extensions → Developer mode → Load unpacked → select the unzipped folder."

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
